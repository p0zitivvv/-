<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбом двора</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Hero Section -->
    <header class="hero animate-fade-in">
        <div class="glow"></div>
        <div class="hero-content">
            <h1 class="hero-title">Красотки талдыка!</h1>
        </div>
    </header>

    <!-- Album Sections -->
    <section id="album" class="section">
        <div class="album-grid">
            <div class="album-card glass">
                <div class="card-image-wrapper">
                    <img src="images/photo1.jpg" alt="" loading="lazy">
                </div>
            </div>

            <div class="album-card glass" style="margin-top: 40px;">
                <div class="card-image-wrapper">
                    <img src="images/photo2.jpg" alt="" loading="lazy">
                </div>
            </div>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="section">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/photo3.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item span-2">
                <video autoplay loop muted playsinline>
                    <source src="videos/video.mp4" type="video/mp4">
                </video>
            </div>
            <div class="gallery-item span-2">
                <img src="images/photo4.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item span-2">
                <img src="images/photo5.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo6.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo7.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo8.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo9.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo10.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo11.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo12.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo13.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item">
                <img src="images/photo14.jpg" alt="" loading="lazy">
            </div>
        </div>
    </section>
</body>

</html>
